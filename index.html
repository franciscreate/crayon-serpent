const cv=document.getElementById("c"),ctx=cv.getContext("2d");
function fit(){const d=devicePixelRatio||1;cv.width=Math.round(cv.clientWidth*d);cv.height=Math.round(cv.clientWidth*d*H/W)}
addEventListener("resize",fit);fit();
// --- ligne centrale : créneaux à coins arrondis (mesurés sur le PDF), échantillonnée tous les ~3 pt
const XS=Array.from({length:7},(_,i)=>201.76+261.45*i),YT=179.54,YB=1127.16,R=51,DS=3;
const C=[],WN=[];const add=(x,y,w=0)=>{C.push([x,y]);WN.push(w)};
